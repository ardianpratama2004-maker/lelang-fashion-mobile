name: Mobile CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - mobile-v*
      - v*
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag release untuk APK manual.
        required: false
        default: mobile-latest

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  quality:
    name: Validate Flutter Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create local dotenv from GitHub config
        env:
          API_BASE_URL_SECRET: ${{ secrets.API_BASE_URL }}
          API_BASE_URL_VAR: ${{ vars.API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL="${API_BASE_URL_SECRET:-${API_BASE_URL_VAR:-http://10.0.2.2:8000/api}}"
          printf 'API_BASE_URL=%s\n' "$API_BASE_URL" > .env

      - name: Analyze Dart code
        run: dart analyze

      - name: Run Flutter tests
        run: flutter test

  build-release-apk:
    name: Build and Publish Release APK
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_NAME="Lelang Fashion Mobile ${GITHUB_REF_NAME}"
            PRERELEASE="false"
            MAKE_LATEST="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="${{ inputs.release_tag }}"
            RELEASE_NAME="Lelang Fashion Mobile ${TAG_NAME}"
            PRERELEASE="true"
            MAKE_LATEST="false"
          else
            TAG_NAME="mobile-latest"
            RELEASE_NAME="Lelang Fashion Mobile Latest APK"
            PRERELEASE="true"
            MAKE_LATEST="false"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "production_apk=lelang-fashion-production-${TAG_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "debug_apk=lelang-fashion-debug-${TAG_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Build production APK
        env:
          API_BASE_URL_SECRET: ${{ secrets.API_BASE_URL }}
          API_BASE_URL_VAR: ${{ vars.API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL="${API_BASE_URL_SECRET:-${API_BASE_URL_VAR:-https://lelang-fashion.solvo-tech.site/api}}"
          printf 'API_BASE_URL=%s\n' "$API_BASE_URL" > .env
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.release.outputs.production_apk }}"

      - name: Build debug endpoint APK
        env:
          API_BASE_URL_DEBUG_SECRET: ${{ secrets.API_BASE_URL_DEBUG }}
          API_BASE_URL_DEBUG_VAR: ${{ vars.API_BASE_URL_DEBUG }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL="${API_BASE_URL_DEBUG_SECRET:-${API_BASE_URL_DEBUG_VAR:-https://handwoven-ramp-avid.ngrok-free.dev/api}}"
          printf 'API_BASE_URL=%s\n' "$API_BASE_URL" > .env
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.release.outputs.debug_apk }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lelang-fashion-apks
          path: lelang-fashion-*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.release_name }}
          body: |
            APK release dibangun otomatis oleh GitHub Actions.

            Commit: ${{ github.sha }}
            Konfigurasi API APK ditulis ke `.env` saat build dari GitHub Secrets atau Variables.
          files: lelang-fashion-*.apk
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.make_latest }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Write release summary
        run: |
          echo "APK published to GitHub Release: ${{ steps.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
